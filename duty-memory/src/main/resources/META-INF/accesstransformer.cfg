# Duty: Memory access transformer.

# TagKey/ResourceKey interning constructs shared instances directly. Both constructors are
# private, so they need widening; there is no injection point that would avoid this.
public net.minecraft.resources.ResourceKey <init>(Lnet/minecraft/resources/Identifier;Lnet/minecraft/resources/Identifier;)V
public net.minecraft.tags.TagKey <init>(Lnet/minecraft/resources/ResourceKey;Lnet/minecraft/resources/Identifier;)V
