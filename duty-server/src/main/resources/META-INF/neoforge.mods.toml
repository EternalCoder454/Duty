modLoader = "javafml"
loaderVersion = "[1,)"
license = "GNU LGPL 3.0"

[[mods]]
modId = "duty_server"
version = "${mod_version}"
displayName = "Duty: Server"
logoFile = "icon.png"
authors = "Duty"
credits = "Derived from BiomeSpy by MoePus (LGPL-3.0)."
description = '''
Duty does what it needs to do, perform its duty.

Server: work that runs on the logical server. Replaces the brute-force scan behind
/locate biome and /locate structure with a targeted search.
'''

[[mixins]]
config = "duty_server.mixins.json"

# Kept separate from the config above rather than merged into it. A mixin config names exactly
# one plugin, and BiomeSpy's gates TerraBlender compat while this one gates the pipeline
# features -- folding them together would silently drop one of the two.
[[mixins]]
config = "duty_server_net.mixins.json"

[[dependencies.duty_server]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.duty_server]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.duty_server]]
modId = "biomespy"
type = "incompatible"
reason = "Duty: Server already contains BiomeSpy."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

# Compat mixins for TerraBlender apply only when it is present; see the mixin plugin.
[[dependencies.duty_server]]
modId = "terrablender"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# e4mc wraps the connection in its own tunnel and installs handlers around the cipher. The
# native encryption mixins stand down when it is present; see NetMixinPlugin.
[[dependencies.duty_server]]
modId = "e4mc"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Cloth Config is optional: it only provides the in-game settings screen. Without it
# Duty behaves identically and is configured through config/duty.properties.
[[dependencies.duty_server]]
modId = "cloth_config"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
