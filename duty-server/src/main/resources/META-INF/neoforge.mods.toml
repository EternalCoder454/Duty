modLoader = "javafml"
loaderVersion = "[1,)"
license = "GNU LGPL 3.0"

[[mods]]
modId = "duty_server"
version = "${mod_version}"
displayName = "Duty: Server"
logoFile = "icon.png"
authors = "Duty"
credits = "Derived from BiomeSpy by MoePus (LGPL-3.0)."
description = '''
Duty does what it needs to do, perform its duty.

Server: work that runs on the logical server. A targeted search behind /locate instead
of a brute-force scan, a faster redstone update order, native compression and encryption
on the network path, and autosaves written off the server thread.
'''

[[mixins]]
config = "duty_server.mixins.json"

# Kept separate from the config above rather than merged into it. A mixin config names exactly one
# plugin, and this one has NetMixinPlugin gating the pipeline features on their options and on
# e4mc's presence. The biome config no longer has a plugin at all -- its only job was gating a
# TerraBlender compat package that was never ported -- but merging the two would still mean one
# config's mixins silently inheriting the other's gate.
[[mixins]]
config = "duty_server_net.mixins.json"

# Alternate Current's redstone dust. Its own config, because the plugin refuses to apply the
# mixins at all when the feature is off -- that is what keeps RedStoneWireBlock untouched for
# Lithium rather than merely idle.
[[mixins]]
config = "duty_server_wire.mixins.json"

# Hot world-data maths. No plugin: these are unconditional inlinings of vanilla methods with no
# option behind them, and nothing else installed patches either class.
[[mixins]]
config = "duty_server_worldmath.mixins.json"

# Asynchronous world saving. No plugin: the feature is gated inside the mixins by
# AsyncWorldSave.enabled(), because the fallback has to stay reachable -- turning it off must
# still write, just synchronously.
[[mixins]]
config = "duty_server_save.mixins.json"

# Watchdog on structure searches. No plugin: the timeout is read per search from the config, so
# setting it to 0 has to leave the injections in place and simply never fire them.
[[mixins]]
config = "duty_server_structure.mixins.json"

# Jigsaw structure assembly. No plugin: the octree replaces vanilla's shape unconditionally because
# it answers the same question and generates identical structures, and the one option that does
# change output is read inside the mixins rather than gating them.
[[mixins]]
config = "duty_server_jigsaw.mixins.json"

# How much world a joining player waits for. No plugin: the radius is read from the config inside
# the mixin, so setting it back to 3 restores vanilla without unapplying anything.
[[mixins]]
config = "duty_server_spawn.mixins.json"




[[dependencies.duty_server]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.duty_server]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.duty_server]]
modId = "biomespy"
type = "incompatible"
reason = "Duty: Server already contains BiomeSpy."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

# No entry for the biome-layering mods. TerraBlender's was here for compat mixins that were never
# ported, and the modern equivalents -- Lithostitched, Biolith -- do not need load ordering: they
# wrap the biome source at runtime, and BiomeSpy checks for that when a search actually happens.
# See BiomeSpyCompat.

# e4mc wraps the connection in its own tunnel and installs handlers around the cipher. The
# native encryption mixins stand down when it is present; see NetMixinPlugin.
[[dependencies.duty_server]]
modId = "e4mc"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Cloth Config is optional: it only provides the in-game settings screen. Without it
# Duty behaves identically and is configured through config/duty.properties.
[[dependencies.duty_server]]
modId = "cloth_config"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
