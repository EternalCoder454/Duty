# Duty: Server access transformer.

# The light engine reads block states out of a section by raw index, on its hottest path -- once
# per block per light update. LevelChunkSection.getStates() is public, but the index-taking
# PalettedContainer.get(int) behind it is protected, so going through the getter still would not
# compile. Widening both is what lets the engine index the palette directly instead of going
# through get(x, y, z) and re-deriving the index it already has.
public net.minecraft.world.level.chunk.LevelChunkSection states
public net.minecraft.world.level.chunk.PalettedContainer get(I)Ljava/lang/Object;

# The light engine hands completion work back to the chunk map's thread, and has to ask whether it
# is already on that thread before deciding to. ChunkMap exposes neither.
public net.minecraft.server.level.ChunkMap mainThreadExecutor

# LevelLightEngine.blockEngine and .skyEngine are private final and are written by
# LevelLightEngineMixin. That needs final stripped, but it is done there with Mixin's own
# @Final @Mutable rather than here, which keeps the change scoped to the one mixin that wants it
# and matches what SerializableChunkDataMixin already does for lightCorrect.
