# Hand-maintained additions to the generated accesstransformer.cfg.
#
# Fabric's accessWidener widens a virtual method's overrides for you. NeoForge's access
# transformer does not, so widening a base method alone produces:
#
#   search(...) in Climate.RTree.Leaf cannot override search(...) in Climate.RTree.Node
#   attempting to assign weaker access privileges
#
# Climate$RTree$Node.search is protected abstract, and both subclasses override it. The
# generated file widens the base because that is what the accessWidener asked for; these
# two are the overrides that have to come with it.
public net.minecraft.world.level.biome.Climate$RTree$Leaf search([JLnet/minecraft/world/level/biome/Climate$RTree$Leaf;Lnet/minecraft/world/level/biome/Climate$DistanceMetric;)Lnet/minecraft/world/level/biome/Climate$RTree$Leaf;
public net.minecraft.world.level.biome.Climate$RTree$SubTree search([JLnet/minecraft/world/level/biome/Climate$RTree$Leaf;Lnet/minecraft/world/level/biome/Climate$DistanceMetric;)Lnet/minecraft/world/level/biome/Climate$RTree$Leaf;
