# -Djava.net.preferIPv4Stack=true: Gradle talks to its own worker processes over a
# loopback socket. On hosts where the IPv6 loopback is present but not usable this
# fails with "Unable to establish loopback connection", which looks like a build
# script error but is not one. Pinning to IPv4 avoids it and costs nothing.
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# The target this branch builds.
#
# Duty carries one target per branch rather than gating versions inside one
# source tree. Every branch is a full checkout that builds one thing, so a
# build is never a matrix of conditions and a checkout is never half-configured
# for a version you are not on.
#
#     main              NeoForge  26.1.2+   Java 25
#     neoforge-1.21.1   NeoForge  1.21.1    Java 21
#     fabric-26.1.2     Fabric    26.1.2+   Java 25
#     forge-1.20.1      Forge     1.20.1    Java 17
#
# duty.loader names the loader source set: every module is split into
# src/main, which names no loader, and src/<duty.loader>, which is the only
# place allowed to import one. Changing branches changes this property; it is
# not meant to be edited in place.
# ---------------------------------------------------------------------------
duty.loader=neoforge
minecraft_version=26.1.2
neoforge_version=26.1.2.95
mdg_version=2.0.144

parchment_mc_version=1.21.11
parchment_version=2025.12.20

group=net.dutymod
mod_version=0.1.0

# Java 25 is what NeoForge 26.1 ships on.
java_version=25

mixinextras_version=0.4.1

# Optional integrations for duty-fixerupper. Compile-only: each guards a fix for a
# specific mod, and none is required at runtime. Versions carried over from ModernFix.
jei_version=27.3.0.12
jei_minecraft_version=1.21.11
spark_version=4392788
ctm_version=5587515
ldlib_version=5782845

# Optional integrations for duty-client. Compile-only: the matching compat mixins are
# gated on the mod actually being installed, so none of these is required at runtime.
sodium_version=0.8.12+mc26.1.2
iris_version=1.10.9+26.1-neoforge
emf_version=3.2.4-neoforge-26.1
etf_version=7.1-neoforge-26.1
lootr_version=DZnEpHKO

# Velocity's native compression/encryption, as republished by KryptonReno's author.
# Pinned to the resolved timestamp of 3.4.0-SNAPSHOT rather than the moving SNAPSHOT tag:
# the upstream is a personal Maven and a floating snapshot would let a rebuild silently
# change the native code underneath the network pipeline.
velocity_native_version=3.4.0-20260111.140946-9

# Cloth Config: optional at runtime, compile-only in the build. Version matches the jar
# already in the test pack (cloth-config-26.1.154.jar, modId cloth_config).
cloth_config_version=26.1.154

# Duty: Innovative (Async) -- MixinSquared is required, Lithium is compile-only.
mixinsquared_version=0.3.3
lithium_version=mc26.1.2-0.24.7-neoforge
